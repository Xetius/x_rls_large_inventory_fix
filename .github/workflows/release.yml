name: Release

# Push a semver tag without a "v" prefix (1.0.0, 1.2.3-beta.1) to build x_rls_large_inventory_fix_<tag>.zip
# and publish it as a GitHub release. Tags with a pre-release part (anything after "-") are marked as pre-releases.
on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag is semver without a v prefix
        run: |
          tag="$GITHUB_REF_NAME"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$tag" =~ $semver ]]; then
            echo "::error::Tag '$tag' is not semver like 1.2.3 or 1.2.3-beta.1 (no v prefix)"
            exit 1
          fi

      - name: Build mod zip
        run: |
          zip_name="x_rls_large_inventory_fix_${GITHUB_REF_NAME}.zip"
          # Only the mod's own files, at the root of the zip as BeamNG expects.
          zip -r -X "$zip_name" lua scripts mod_info README.txt
          unzip -l "$zip_name"
          echo "ZIP_NAME=$zip_name" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "$ZIP_NAME" --title "x_rls_large_inventory_fix $GITHUB_REF_NAME" --generate-notes $prerelease
